<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Charts with Chart.js and OOP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .chart-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 20px;
      }
      .chart-card {
        width: 90%;
        max-width: 400px;
        margin: 20px;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">Dynamic Charts with Chart.js and OOP</h1>
    <div class="chart-container">
    
      <div class="chart-card">
        <canvas id="barChart"></canvas>
      </div>

      <div class="chart-card">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <script src="chart Creator.js"></script>
  </body>
</html>
